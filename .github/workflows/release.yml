name: Release

# Publishes to npm when a version tag (v0.1.1, …) is pushed. Uses npm trusted
# publishing (OIDC): no npm token is stored in the repo. The trusted publisher
# is configured on npmjs.com under the package's Settings.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p 'require(`./package.json`).version')" = "$GITHUB_REF_NAME"
      - run: npm publish
