name: Release

# Publishes to npm when a version tag (v0.1.1, …) is pushed. Uses npm trusted
# publishing (OIDC): no npm token is stored in the repo. The trusted publisher
# is configured on npmjs.com under the package's Settings.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json version
        run: test "v$(node -p 'require(`./package.json`).version')" = "$GITHUB_REF_NAME"
      # npm, not pnpm, publishes: npm does the trusted-publishing (OIDC) exchange.
      # prepublishOnly still runs typecheck and tests through pnpm.
      - run: npm publish
